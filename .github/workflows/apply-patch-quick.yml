name: Apply patch (quick)

# Manual workflow, no checks. Applies one .patch file from the repo root and deletes the patch file.
#   mode main:   the change is committed straight onto the base branch (normally main).
#   mode branch: the change is committed on a new branch named after the patch; main is not touched.
# The patch file is also removed from the branch it was uploaded to. The full checks are not run here;
# run_ci starts ci.yml on the result instead, and that run does not hold this one up.
# Pushes made with GITHUB_TOKEN do not start ci.yml by themselves, which is why it is started explicitly.

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Patch file name in the repo root, like step-ui2-home.patch"
        required: true
        default: step-ui1-shell.patch
        type: string
      mode:
        description: "main = apply straight onto the base branch; branch = apply on a new branch named after the patch"
        required: true
        default: main
        type: choice
        options: [main, branch]
      base_branch:
        description: "Branch to apply on top of (normally main)"
        required: true
        default: main
        type: string
      run_ci:
        description: "Start ci.yml on the result (runs on its own, does not delay this workflow)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-patch-quick
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PATCH_INPUT: ${{ inputs.patch }}
      MODE: ${{ inputs.mode }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate inputs and stage the patch
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$PATCH_INPUT" =~ ^[A-Za-z0-9._-]+\.patch$ ]] || [[ "$PATCH_INPUT" == *..* ]]; then
            echo "::error::patch must be a file name in the repo root like step-ui2-home.patch (letters, digits, . _ - only)"; exit 1
          fi
          if [ "$MODE" != "main" ] && [ "$MODE" != "branch" ]; then echo "::error::mode must be main or branch"; exit 1; fi
          if ! [[ "$BASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then echo "::error::invalid base branch name"; exit 1; fi
          [ -f "$PATCH_INPUT" ] || { echo "::error::$PATCH_INPUT not found on ${GITHUB_REF_NAME}. Commit it to the branch you ran this workflow from first."; exit 1; }
          git ls-remote --exit-code --heads origin "$BASE_BRANCH" >/dev/null || { echo "::error::base branch $BASE_BRANCH does not exist"; exit 1; }
          cp "$PATCH_INPUT" "$RUNNER_TEMP/step.patch"

      - name: Apply, delete the patch file, commit and push
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          NAME="$(basename "$PATCH_INPUT" .patch)"
          if [ "$MODE" = "main" ]; then TARGET="$BASE_BRANCH"; else TARGET="$NAME"; fi
          if [ "$MODE" = "branch" ] && git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
            echo "::error::Branch $TARGET already exists. Delete it first, or use mode main."; exit 1
          fi
          git checkout -q -B work "origin/$BASE_BRANCH"
          if ! git apply --check "$RUNNER_TEMP/step.patch"; then
            echo "::error::The patch does not apply on $BASE_BRANCH. If an earlier patch is not applied yet, apply that one first."
            exit 1
          fi
          git apply --index "$RUNNER_TEMP/step.patch"
          git rm -q --ignore-unmatch -- "$PATCH_INPUT"
          git commit -q -m "$NAME"
          git log --oneline -2
          if ! git push origin "HEAD:refs/heads/$TARGET"; then
            echo "::error::Push to $TARGET was refused (branch protection, or $TARGET changed while this ran). Run again, or use mode branch."
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Applied $PATCH_INPUT onto $TARGET." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the patch file from the branch it was uploaded to
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch -q origin "$SOURCE_BRANCH"
          git checkout -q -B cleanup "origin/$SOURCE_BRANCH"
          if [ -f "$PATCH_INPUT" ]; then
            git rm -q -- "$PATCH_INPUT"
            git commit -q -m "Remove applied patch $PATCH_INPUT"
            git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          else
            echo "$PATCH_INPUT is already gone from $SOURCE_BRANCH."
          fi

      - name: Start ci.yml on the result
        if: ${{ inputs.run_ci }}
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ steps.apply.outputs.target }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$TARGET"
          echo "CI started on $TARGET: see the Actions tab." >> "$GITHUB_STEP_SUMMARY"
